name = "stconnection"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
SITE_NAME = "ST CONNECTION"
DEFAULT_GATE_PASS = "782223"

# =========================================================
# Cloudflare D1 Relational SQL Database Binding
# Create via: npx wrangler d1 create stconnection-db
# =========================================================
[[d1_databases]]
binding = "DB"
database_name = "stconnection-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# =========================================================
# Cloudflare R2 Object Storage Bucket Binding
# Create via: npx wrangler r2 bucket create stconnection-media
# =========================================================
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "stconnection-media"
preview_bucket_name = "stconnection-media-preview"
